[versions]
agp = "9.1.1"
kotlin = "2.1.10"
googleServicesVersion = "4.4.2"
firebaseCrashlyticsVersion = "3.0.3"
hilt = "2.60.1"
core-ktx = "1.16.0"
junit = "4.13.2"
coroutines = "1.9.0"
composeBomVersion = "2025.04.01"
junit4composeVersion = "1.8.0"
composeHilt = "1.2.0"
appcompat = "1.7.0"
material = "1.12.0"
navigation = "2.8.9"
junitKtx = "1.3.0"
firebaseBOMVersion = "33.12.0"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
testRunner = "1.7.0"
testMonitor = "1.8.0"
androidxConcurrentFutures = "1.2.0"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "junitKtx" }
hiltAndroid = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt"}
hiltAndroidTesting = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt"}
hiltCompiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt"}
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
testCoroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBomVersion" }
composeViewModel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose" }
composeMaterialIconsCore = { group = "androidx.compose.material", name = "material-icons-core" }
composeMaterialIconsExtended = { group = "androidx.compose.material", name = "material-icons-extended" }
composeUiTooling = { group = "androidx.compose.ui", name = "ui-tooling" }
composeMaterial = { group = "androidx.compose.material3", name = "material3" }
composeActivity = { group = "androidx.activity", name = "activity-compose" }
composeHilt = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "composeHilt" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
navigationFragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigationUi = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
composeTest = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "junit4composeVersion" }
composeTestRule = { group = "androidx.compose.ui", name = "ui-test-manifest" }
firebaseBOM = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBOMVersion" }
firebaseCrashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebaseCrashlyticsVersion"}
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
test-runner-lib = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
test-monitor-lib = { group = "androidx.test", name = "monitor", version.ref = "testMonitor" }
concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures", version.ref = "androidxConcurrentFutures" }

[bundles]
compose = ["composeMaterialIconsCore", "composeMaterialIconsExtended", "composeUiTooling", "composeMaterial", "composeActivity", "composeViewModel", "composeHilt"]
navigation = ["navigationFragment", "navigationUi"]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServicesVersion" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsVersion" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }