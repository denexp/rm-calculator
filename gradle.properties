#Forces you to use androidx for compatibility between versions
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
android.enableJetifier=false
#Avoid having to generate resource ids at compile time
android.nonFinalResIds=false
#Track project performance
firebasePerformanceInstrumentationEnabled=true
#We add the kotlin code convention
kotlin.code.style=official
#Recompile only the differences between the previous compilation in terms of Kotlin
kotlin.incremental=true
#Recompiles only the differences between the previous compilation in terms of ksp
ksp.incremental=true
#Only recompile modules with changes
org.gradle.configureondemand=true
#It has the necessary tasks in the background so that it does not take longer to load the project the first time
org.gradle.daemon=true
#Increased ram memory for the java virtual machine(Before 2048)
org.gradle.jvmargs=-Xmx8192m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
#Take advantage of the threads of the CPU cores to launch tasks
org.gradle.parallel=true
#Non transitive R class between module
android.nonTransitiveRClass=true
#Gradle cache
org.gradle.configuration-cache=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false